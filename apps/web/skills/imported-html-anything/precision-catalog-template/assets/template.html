<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --bg:#ffffff; --panel:#eef4ff; --text:#182433; --accent:#2e6cf6; }
    .catalog-shell { display:grid; gap:18px; }
    .catalog-lead { padding:24px; background:var(--panel); border-radius:20px; }
    .spec-table { display:grid; gap:10px; }
    .inquiry-strip { padding:20px; border:1px solid #cbd5e1; }
  </style>
</head>
<body>
  <main class="catalog-shell">
    <section class="catalog-lead" data-od-id="catalog-lead"><h1>Catalog lead</h1></section>
    <section class="spec-table" data-od-id="spec-table"><article>Spec comparison</article></section>
  </main>
</body>
</html>
