<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #fff9ef;
      --panel: #ffffff;
      --text: #261a13;
      --accent: #7a3524;
    }
    .resource-ledger-shell { display: grid; gap: 24px; }
    .resource-lead { padding: 24px; border: 1px solid #d8c6ad; }
    .download-ledger { display: grid; gap: 12px; }
  </style>
</head>
<body>
  <main class="resource-ledger-shell">
    <section class="resource-lead" data-od-id="resource-lead">
      <p>Resources</p>
      <h1>Find governed research, standards, and downloadable material</h1>
    </section>
    <section class="download-ledger" data-od-id="download-ledger">
      <article class="card">Research brief</article>
      <article class="card">Standards pack</article>
      <article class="card">Download row</article>
    </section>
  </main>
</body>
</html>
