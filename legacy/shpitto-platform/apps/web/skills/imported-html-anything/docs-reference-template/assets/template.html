<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #f7f8fb;
      --panel: #eef3fa;
      --text: #172033;
      --accent: #2454d8;
    }
    .reference-shell { display: grid; gap: 20px; }
    .reference-lead { background: var(--panel); padding: 24px; border-radius: 18px; }
    .steps-list { display: grid; gap: 12px; }
  </style>
</head>
<body>
  <main class="reference-shell">
    <section class="reference-lead" data-od-id="reference-lead">
      <p>Reference</p>
      <h1>Implementation guide</h1>
    </section>
    <section class="steps-list" data-od-id="steps-list">
      <article class="card">Required input</article>
      <article class="card">Implementation step</article>
      <article class="card">Cross-link</article>
    </section>
  </main>
</body>
</html>
