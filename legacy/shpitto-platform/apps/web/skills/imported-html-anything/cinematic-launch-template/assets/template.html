<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --bg:#06070b; --surface:#10131a; --text:#f8fafc; --accent:#60a5fa; }
    .launch-shell { display:grid; gap:22px; color:var(--text); background:var(--bg); }
    .cinematic-stage { padding:36px; background:radial-gradient(circle at top left,#182034,#06070b); border-radius:28px; }
    .demo-strip { display:grid; grid-template-columns:1.2fr .8fr; gap:16px; }
    .signup-band { padding:22px; border:1px solid rgba(255,255,255,.18); }
    @media (max-width:920px) { .demo-strip { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main class="launch-shell">
    <section class="cinematic-stage" data-od-id="cinematic-stage"><h1>Cinematic stage</h1></section>
    <section class="demo-strip" data-od-id="demo-strip"><article>Demo</article><article>Chapter</article></section>
  </main>
</body>
</html>
